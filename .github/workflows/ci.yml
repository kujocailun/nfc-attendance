name: Source verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r admin/requirements-lock.txt
      - run: python tools/check_public.py
      - run: python -m unittest discover -s admin/tests -p 'test_*.py' -v
      - run: node --test admin/tests/test_status_refresh.cjs
      - run: python tools/test_native.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: pio run -e s3_n16r8
